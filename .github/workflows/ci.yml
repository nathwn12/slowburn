# nathwn12 house CI - stack: tauri (bun frontend + cargo backend)
#
# Required check on main is the JOB NAME `build` - do not rename it. `static`
# runs the cheap typings/lint gate first; `build` runs the browser and cargo
# legs. No bundling here: signing/NSIS belongs in a release workflow.
#
# Pushes are NEVER cancelled: the old `cancel-in-progress: true` let a new
# push to main kill the run testing the previous push (runs 45844507935 and
# 45836320686 were cancelled exactly when the next main push started).
# A docs-only change keeps the required check green; scope is API-based.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}
env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  static:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Scope from the GitHub API
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          docs='^(.*\.md|docs/.*|LICEN[CS]E(\.md)?)$'
          files=""
          if [ "$EVENT" = "pull_request" ] && [ -n "$PR" ]; then
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' || true)
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --paginate --jq '.files[].filename' || true)
          fi
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE "$docs"; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.scope.outputs.code == 'true'
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.scope.outputs.code == 'true'
        with:
          node-version-file: .nvmrc
      - name: Cache bun install
        if: steps.scope.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        if: steps.scope.outputs.code == 'true'
        run: bun install --frozen-lockfile
      - name: Frontend typings
        if: steps.scope.outputs.code == 'true'
        run: bun run test:typings
      # AGENTS.md: after UI edits `vp check` (format, lint, type-check) must pass
      # and the UI checks must run. The UI checks are in the build job below.
      - name: Frontend checks (vp check)
        if: steps.scope.outputs.code == 'true'
        run: bunx vp check
      - name: Scope
        if: always()
        run: |
          echo "scope: ${{ steps.scope.outputs.code == 'true' && 'code changed - the full gate ran' || 'docs-only - the required check stays green' }}"

  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Scope from the GitHub API
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          docs='^(.*\.md|docs/.*|LICEN[CS]E(\.md)?)$'
          files=""
          if [ "$EVENT" = "pull_request" ] && [ -n "$PR" ]; then
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' || true)
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --paginate --jq '.files[].filename' || true)
          fi
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE "$docs"; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
          # Slice: a PR touching only src-tauri/ skips the browser e2e leg;
          # a PR touching only frontend files skips cargo. push/main runs both.
          if [ -z "$files" ] || [ "$EVENT" = "push" ]; then
            rust=true
            frontend=true
          else
            if printf '%s\n' "$files" | grep -q '^src-tauri/'; then rust=true; else rust=false; fi
            if printf '%s\n' "$files" | grep -qv '^src-tauri/'; then frontend=true; else frontend=false; fi
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.scope.outputs.code == 'true'
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.scope.outputs.code == 'true'
        with:
          node-version-file: .nvmrc
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        if: steps.scope.outputs.code == 'true' && steps.scope.outputs.rust == 'true'
      - name: Cache bun install
        if: steps.scope.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Cache cargo (src-tauri only)
        if: steps.scope.outputs.code == 'true' && steps.scope.outputs.rust == 'true'
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri
          shared-key: slowburn-ci
      - name: Install dependencies
        if: steps.scope.outputs.code == 'true'
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        if: steps.scope.outputs.code == 'true' && steps.scope.outputs.frontend == 'true'
        run: bunx playwright install chromium
      - name: UI checks (headless e2e)
        if: steps.scope.outputs.code == 'true' && steps.scope.outputs.frontend == 'true'
        run: bunx vp test run --project e2e
      - name: Rust build
        if: steps.scope.outputs.code == 'true' && steps.scope.outputs.rust == 'true'
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml
      - name: Rust test
        if: steps.scope.outputs.code == 'true' && steps.scope.outputs.rust == 'true'
        # One thread, deliberately. The only crash on record (0xC0000005
        # STATUS_ACCESS_VIOLATION, run 43864314912, and once locally) died
        # before the parallel harness printed a single test name, so the run
        # said nothing about where it happened. Serially, the last line is the
        # test that was running: the next occurrence is diagnosable.
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1
      - name: Scope
        if: always()
        run: |
          echo "scope: ${{ steps.scope.outputs.code == 'true' && 'code changed - the full gate ran' || 'docs-only - the required check stays green' }}"
