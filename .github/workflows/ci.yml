# nathwn12 house CI — stack: tauri (bun frontend + cargo backend, copy to .github/workflows/ci.yml)
#
# Windows-only Tauri app. The bun leg honours the repo's `packageManager` pin
# and installs with --frozen-lockfile; the cargo leg keys off
# src-tauri/Cargo.toml. There is deliberately NO `tauri build` / bundling step:
# bundling needs signing/NSIS and does not belong in a build+test gate.
name: ci
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Rust changes
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^src-tauri/'; then
              echo "rust=true" >> "$GITHUB_OUTPUT"
            else
              echo "rust=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "rust=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Frontend typings
        run: bun run test:typings
      # AGENTS.md ("Agent Operations Rules"): after UI edits `vp check`
      # (format, lint, type-check) must pass and the UI checks must run.
      - name: Frontend checks (vp check)
        run: bunx vp check
      - name: Install Playwright Chromium
        run: bunx playwright install chromium
      - name: UI checks (headless e2e)
        run: bunx vp test run --project e2e
      - name: Rust build
        if: steps.changes.outputs.rust == 'true'
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml
      - name: Rust test
        if: steps.changes.outputs.rust == 'true'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
